[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartndvi"
version = "0.1.0"
description = "A Typer-based command-line application"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Xingchen Zhao", email = "xczhao007@gmail.com"}
]

dependencies = [
    "typer>=0.12.0",
    "opencv>=4.8.0",
    "numpy>=1.26.0",
    "joblib>=1.3.2",
    "mmsegmentation>=1.2.2",
    "xarray>=2023.7.0",
    "tomlkit>=0.13.2",
    "pandas>=2.0.3",
    "progressbar2>=4.5.0",
    "rioxarray>=0.17.0"

]

[project.urls]
Homepage = "https://github.com/yourname/yourapp"
Repository = "https://github.com/yourname/yourapp"

# THIS creates the CLI command
[project.scripts]
yourapp = "yourapp.cli:main"
